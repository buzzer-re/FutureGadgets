name: Release

# Publishes the terminal tools as universal macOS binaries. Tools are discovered by convention:
#   <dir>/Makefile   -> `make` must produce ./<dir>/<dir>
# GUI apps are not published; install-gui.sh builds them on the user's machine.
#
# Push a tag like `v1.2.0` to publish a GitHub Release.
# Run manually (Actions -> Release -> Run workflow) to get the builds as artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tui: ${{ steps.meta.outputs.tui }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          tools=$(for d in */; do [[ -f "${d}Makefile" ]] && echo "${d%/}"; done || true)
          if [[ -n "$tools" ]]; then
            echo "tui=$(printf '%s\n' $tools | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          else
            echo "tui=[]" >> "$GITHUB_OUTPUT"
          fi

  tui:
    needs: discover
    if: needs.discover.outputs.tui != '[]'
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover.outputs.tui) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Passed through the environment so each Makefile's own `CFLAGS +=` still applies.
      - name: Build universal binary
        working-directory: ${{ matrix.tool }}
        env:
          CFLAGS: -O2 -arch arm64 -arch x86_64
        run: |
          make
          lipo -info "${{ matrix.tool }}"

      - name: Package
        run: |
          tar -czf "${{ matrix.tool }}-macos.tar.gz" -C "${{ matrix.tool }}" "${{ matrix.tool }}"
          shasum -a 256 "${{ matrix.tool }}-macos.tar.gz" > "${{ matrix.tool }}-macos.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.tool }}
          path: ${{ matrix.tool }}-macos.tar.gz*
          if-no-files-found: error

  publish:
    needs: tui
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Manifest the installer reads: one tool per line.
      - name: Write manifest
        working-directory: dist
        run: |
          for f in *-macos.tar.gz; do echo "${f%-macos.tar.gz}"; done > tui-tools.txt
          ls -l

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF2'
          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          ```

          Universal binaries (arm64 + x86_64) go to `~/.local/bin`.
          EOF2
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
